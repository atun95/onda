<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onda - Sắp Ra Mắt</title>
    <meta name="description" content="Sản phẩm của hãng Onda đang trong giai đoạn hoàn thiện.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <header>
            <div class="logo">ONDA</div>
        </header>

        <main>
            <h1 class="title">Sắp <span class="highlight">Ra Mắt</span></h1>
            <p class="subtitle">Sản phẩm công nghệ đột phá từ <strong>Onda</strong> sắp chính thức ra mắt. <br>Đội ngũ của chúng tôi đang nỗ lực hoàn thiện những chi tiết cuối cùng để mang đến trải nghiệm tuyệt vời nhất cho bạn.</p>
            
            <div class="countdown" id="countdown">
                <div class="time-box">
                    <span id="days">00</span>
                    <span class="label">Ngày</span>
                </div>
                <div class="time-box">
                    <span id="hours">00</span>
                    <span class="label">Giờ</span>
                </div>
                <div class="time-box">
                    <span id="minutes">00</span>
                    <span class="label">Phút</span>
                </div>
                <div class="time-box">
                    <span id="seconds">00</span>
                    <span class="label">Giây</span>
                </div>
            </div>

            <form class="notify-form" id="notify-form">
                <input type="email" placeholder="Nhập email của bạn..." required>
                <button type="submit">
                    <span>Nhận thông báo</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </main>

        <footer>
            <div class="socials">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <p>&copy; 2026 Onda. Tất cả các quyền được bảo lưu.</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
